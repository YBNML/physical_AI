# =============================================================================
# physical_AI — conda 환경 정의
#
# 이 파일 하나로 두 프로파일을 모두 덮는다:
#   (A) macOS / osx-arm64      Mac mini M4 32GB — 설계, 기구학 검증, RoboCOIN 분석
#   (B) Linux / linux-64       3090 24GB (학습·SDK 호스트), 1660 Super 6GB (E0·eval)
#
# 왜 한 파일인가
#   environment.yml 에는 플랫폼 selector 문법이 없다. `# [linux]` 같은 표기는
#   conda-build 의 meta.yaml 전용이고 여기서는 그냥 주석으로 무시된다.
#   따라서 "플랫폼마다 다른 패키지"는 이 파일에 넣을 수 없다.
#   아래 목록은 osx-arm64 / linux-64 양쪽에서 동일하게 solve 되는 것만 담았고,
#   플랫폼 분기가 필요한 것은 전부 setup.sh 가 uname/nvidia-smi 로 판단해 처리한다.
#   (osx-arm64 실제 dry-run solve 확인: 189 packages / 94MB, 충돌 없음)
#
# ─── ⚠️ torch 가 이 파일에 없는 이유 (누락이 아니라 의도) ────────────────────
#   1. PyTorch 는 conda 채널 배포를 중단했다. 공식 배포 경로는 pip wheel 이다.
#   2. conda-forge 의 pytorch-gpu 는 CUDA 런타임을 특정 버전으로 끌고 온다.
#      이 프로젝트는 sm_86(3090) / sm_75(1660 Super) / sm_87(Orin) 세 아키텍처를
#      동시에 만족해야 하는데, 한 파일에 CUDA 버전을 박으면 그중 하나가 깨진다.
#   → setup.sh 가 pip 로 설치하며 CUDA 버전을 강제하지 않는다:
#        Linux + NVIDIA   pip install torch          (PyPI 기본 휠 = CUDA 빌드)
#        Linux CPU 전용   pip install torch --index-url .../whl/cpu
#        macOS            pip install torch          (MPS 포함 universal wheel)
#      특정 빌드가 필요하면 TORCH_INDEX_URL 을 주고 실행한다:
#        TORCH_INDEX_URL=https://download.pytorch.org/whl/cu126 bash setup.sh
#
# ─── ⚠️ conda 로 설치할 수 없는 것 (setup.sh 가 안내만 출력) ──────────────────
#   GalbotSDK  벤더 바이너리. linux-x86_64 / linux-aarch64 휠만 존재한다.
#              → macOS 에서는 어떤 방법으로도 설치 불가. 로봇 통신은 회사 Linux 전용.
#              → 설치 후 `python -c "import galbot_sdk"` 로 확인 (모듈명 ⚠️ 확인 필요).
#   LIBERO     PyPI 에 없다. git clone 후 `pip install -e LIBERO` (robosuite 의존).
#              GATE-2(E0) 를 돌릴 CUDA 박스에만 필요하다. Mac 에는 넣지 말 것.
#   TensorRT   아키텍처 종속(Orin sm_87 ≠ 3090 sm_86). 엔진은 배포 타깃에서 직접 빌드.
#
# ─── 버전 고정 정책 ──────────────────────────────────────────────────────────
#   python 만 고정하고 나머지는 풀어 둔다. 세 기계의 OS/아키텍처가 다르므로
#   버전을 박으면 한쪽에서 반드시 solve 가 깨진다. 재현이 필요한 시점(학습 시작)에
#   `make lock` 으로 기계별 lock 파일(conda env export --no-builds)을 남긴다.
#
# ─── pip / conda 혼용 주의 ───────────────────────────────────────────────────
#   아래 나열된 패키지는 pip 말고 conda(= setup.sh)로 넣을 것. pip 로 먼저 넣으면
#   `conda list` 에 pypi_0 로 잡히고, 이후 env update 가 conda-forge 판을 덧씌워
#   같은 패키지가 두 벌 존재하게 된다 (import 되는 쪽이 상황에 따라 바뀐다).
#   이미 그렇게 된 경우: <env>/bin/python -m pip uninstall <이름> 후 setup.sh 재실행.
#   pip 담당은 torch, LIBERO, GalbotSDK, 그리고 아래 pip 절의 MCAP 디코더뿐이다.
#   (MCAP 디코더는 conda-forge 에 판 자체가 없어서 혼용 위험이 없다.)
#
# 사용
#   bash setup.sh            생성/갱신 + 자체 검증
#   bash setup.sh --check    설치 없이 진단만
# =============================================================================
name: physical_ai

channels:
  - conda-forge

dependencies:
  # ── 런타임 ────────────────────────────────────────────────────────────────
  # 3.11 고정: 맥/1660/3090/Orin 네 기계의 파이썬을 하나로 맞춰 둔다.
  # checkpoint·pickle·parquet 를 기계 간에 그대로 옮기는 프로젝트라
  # 마이너 버전이 갈리면 디버깅 비용이 즉시 발생한다.
  - python=3.11
  - pip

  # ── 필수 (리포 코드가 직접 import) ────────────────────────────────────────
  - numpy                 # robot/g1_kinematics.py, interface.py, 전 tools
  - scipy                 # interface.py 의 6D 회전 변환 경로
  - pyarrow               # tools/robocoin_analysis.py — LeRobot parquet 직접 읽기

  # ── 데이터·분석 ───────────────────────────────────────────────────────────
  - pandas                # mcap2lerobot 포크 시 F/T 채널 열 검사 (F1 작업)
  - matplotlib            # GATE-1 Bode plot, L2 붕괴 곡선 등 문서용 그림
  - huggingface_hub       # RoboCOIN 공개 데이터 내려받기

  # ── MCAP 읽기 (tools/mcap2lerobot_fork.py) ────────────────────────────────
  # Galbot 기록은 MCAP 컨테이너다. 이게 없으면 회사 Linux 에서 실제 변환이
  # 아예 안 된다 (--dry-run 은 합성 프레임이라 mcap 없이도 돈다).
  # mcap 본체만 conda-forge 에 있고(noarch), 디코더 플러그인은 PyPI 전용이라
  # 아래 pip 절에 있다. 맥에도 들어가지만 순수 파이썬이라 부담이 없다.
  - mcap

  # ── 시뮬 / 검증 ───────────────────────────────────────────────────────────
  # closed-form S–R–S IK 를 URDF 대조로 검증할 때 쓴다 (PLAN M5).
  # conda-forge mujoco 는 osx-arm64 / linux-64 모두 제공된다 (3.10.0 확인).
  # ⚠️ MJX 경로(JAX)는 여기 없다. 필요해지면 CUDA 박스에서만 pip 로 추가할 것 —
  #    jax[cuda] 는 CUDA 버전을 강하게 요구해서 맥과 공유가 불가능하다.
  - mujoco

  # ── 개발 편의 ─────────────────────────────────────────────────────────────
  - pytest                # robot/test_kinematics.py 는 단독 실행형이지만 이후 확장 대비
  - tqdm
  - pyyaml

  # ── pip 전용 ──────────────────────────────────────────────────────────────
  # conda-forge 에 없는 것만. 위의 "pip/conda 혼용 주의"가 여기에는 해당하지
  # 않는다 — conda 판이 아예 존재하지 않아 덧씌워질 일이 없기 때문이다.
  - pip:
      # MCAP 디코더 플러그인. 실물 기록이 ros2 직렬화인지 protobuf 인지
      # 모르므로(⚠️ 확인 필요) 둘 다 넣는다. mcap2lerobot_fork 는 설치된
      # 쪽만 골라 등록하므로 한쪽만 있어도 동작한다.
      - mcap-ros2-support
      - mcap-protobuf-support
